name: Test Stats
on: [push]

env:
  RUBY_VERSION: 3.4.13
  NODE_VERSION: 22.14.0
  CHROME_VERSION: 151.0.7922.108

jobs:
  test:
    name: Test Stats
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:14
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        env:
          POSTGRES_PASSWORD: postgres
      redis:
        image: redis:3.2-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_HOST: localhost
      RAILS_ENV: test
    steps:
      - uses: actions/checkout@v2.0.0
        with:
          fetch-depth: 1
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
      - run: |
          sudo apt update && sudo apt install libvips libvips-tools
      - name: Install Chrome ${{ env.CHROME_VERSION }}
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libu2f-udev
          wget --no-verbose -O /tmp/chrome.deb https://dl.google.com/linux/chrome/deb/pool/main/g/google-chrome-stable/google-chrome-stable_${{ env.CHROME_VERSION }}-1_amd64.deb
          sudo DEBIAN_FRONTEND=noninteractive dpkg -i /tmp/chrome.deb
          rm /tmp/chrome.deb
      - uses: nanasess/setup-chromedriver@v3
        with:
          chromedriver-version: ${{ env.CHROME_VERSION }}
      - run: bundle exec rake db:test:prepare
        name: Setup database
      - name: Precompile assets
        run: |
          npm install
          bundle exec rake assets:precompile
      - run: bundle exec rspec decidim-stats
        name: Run specs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: ./tmp/screenshots
          if-no-files-found: ignore
          overwrite: true
